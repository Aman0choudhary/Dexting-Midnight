name: Build, Test, and Package

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile-test-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Compact compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # v1
        with:
          compact-version: '0.31.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Compile Compact contract on GitHub Actions
        run: npm run compile

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_NETWORK_ID: preprod

      - name: Upload generated contract and ZK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dexting-managed-room-membership-${{ github.sha }}
          path: managed/room-membership/
          if-no-files-found: error
          retention-days: 7

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: dexting-frontend-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
